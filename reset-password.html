<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyfronex &mdash; Link zostal wyslany</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
</head>
<body>

<div class="math-bg" id="mathBg"></div>

<div class="auth-page" style="grid-template-columns: 1fr; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="auth-card" style="max-width: 460px; margin: 2rem; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">&#x2709;&#xFE0F;</div>
        
        <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; color: #fff; margin-bottom: 0.8rem;">Sprawdz swoja skrzynke</h2>
        
        <p style="color: rgba(240,244,255,0.7); font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem;">
            Wyslalismy link umozliwiajacy zresetowanie hasla na podany adres e-mail.<br>
            <span style="color: #ff9898; font-size: 0.85rem;">Uwaga: link wygasnie za 15 minut.</span>
        </p>

        <a href="index.php" class="btn-primary" style="display: inline-block; text-decoration: none; text-align: center;">&larr; Powrot do logowania</a>
    </div>
</div>

<p class="auth-footer">Copyright &copy;2026 <span> Milosz Biniek</span></p>

<script>
    const symbols = ['\u03A3','\u222B','\u221A','\u03C0','\u221E','\u2248','\u0394','\u2202','\u2207','\u03B1','\u03B2','\u03B3','\u03BB','\u03B8','\u2208','\u2200','\u2203','\u00B1','\u00D7','\u00F7','\u00B2','\u00B3'];
    const container = document.getElementById('mathBg');
    for (let i = 0; i < 22; i++) {
        const span = document.createElement('span');
        span.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        span.style.left = Math.random() * 100 + 'vw';
        span.style.animationDuration = (14 + Math.random() * 20) + 's';
        span.style.animationDelay = (Math.random() * -30) + 's';
        span.style.fontSize = (1 + Math.random() * 1.8) + 'rem';
        span.style.opacity = Math.random() * 0.5 + 0.05;
        container.appendChild(span);
    }
</script>
</body>
</html>
