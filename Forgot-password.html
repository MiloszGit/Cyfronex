<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyfronex &mdash; Odzyskiwanie hasla</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="math-bg" id="mathBg"></div>

<div class="auth-page" style="grid-template-columns: 1fr; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="auth-card" style="max-width: 440px; margin: 2rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <a class="brand-logo" href="index.php" style="justify-content: center; margin-bottom: 1rem;">
                <img src="img/logo.svg" alt="Cyfronex logo" style="width: 56px; height: 56px;">
                <span class="brand-name">Cyfronex</span>
            </a>
            <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; color: #fff; margin-bottom: 0.5rem;">Reset hasla &#x1F511;</h2>
            <p style="color: rgba(240,244,255,0.6); font-size: 0.9rem;">Wpisz swoj adres e-mail, aby otrzymac link do zresetowania hasla.</p>
        </div>

        <form action="reset-password.html" method="POST">
            <div class="form-group">
                <label for="email">Adres e-mail</label>
                <div class="input-wrap">
                    <span class="input-icon">&#x2709;&#xFE0F;</span>
                    <input type="email" id="email" name="email" placeholder="twoj@email.com" required>
                </div>
            </div>

            <button type="submit" class="btn-primary" style="margin-top: 1rem;">Wyslij link resetujacy &rarr;</button>
        </form>

        <p class="switch-link" style="margin-top: 1.5rem;">
            <a href="index.php">&larr; Wroc do logowania</a>
        </p>
    </div>
</div>

<p class="auth-footer">Copyright &copy;2026 <span>Radoslaw Mazur &amp; Milosz Biniek</span></p>

<script>
    const symbols = ['\u03A3','\u222B','\u221A','\u03C0','\u221E','\u2248','\u0394','\u2202','\u2207','\u03B1','\u03B2','\u03B3','\u03BB','\u03B8','\u2208','\u2200','\u2203','\u00B1','\u00D7','\u00F7','\u00B2','\u00B3'];
    const container = document.getElementById('mathBg');
    for (let i = 0; i < 22; i++) {
        const span = document.createElement('span');
        span.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        span.style.left = Math.random() * 100 + 'vw';
        span.style.animationDuration = (14 + Math.random() * 20) + 's';
        span.style.animationDelay = (Math.random() * -30) + 's';
        span.style.fontSize = (1 + Math.random() * 1.8) + 'rem';
        span.style.opacity = Math.random() * 0.5 + 0.05;
        container.appendChild(span);
    }
</script>
</body>
</html>
